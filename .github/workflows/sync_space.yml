# Keeps the Hugging Face Space (mpily/BantuGrammar) in sync with hf_space/ on main.
# A Space is its own git repo: merging on GitHub does not update it by itself.
#
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
# New repository secret  HF_TOKEN  = a Hugging Face access token with WRITE access
# (huggingface.co -> Settings -> Access Tokens). Then run this workflow once from
# the Actions tab ("Run workflow"); afterwards it runs on every merge that touches hf_space/.
name: sync hf_space to the Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["hf_space/**", ".github/workflows/sync_space.yml"]
  workflow_dispatch:

concurrency:
  group: sync-space
  cancel-in-progress: false

jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the API's light dependencies (no torch) + the word checker
        run: |
          pip install "fastapi>=0.110" "uvicorn>=0.29" "pydantic>=2.6" "pyyaml>=6" "httpx>=0.27" \
                      "huggingface_hub>=0.24" "websockets>=12" "pytest>=7"
          pip install "$(grep '^kitaita-oracle' hf_space/requirements.txt)"
      - name: API tests (a failure stops the upload)
        working-directory: hf_space
        run: python -m pytest tests -q
      - name: Upload hf_space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is missing (needs WRITE access to the Space). See the comment at the top of this workflow."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          commit = api.upload_folder(
              repo_id="mpily/BantuGrammar", repo_type="space", folder_path="hf_space",
              commit_message=f"Sync hf_space from GitHub {os.environ['GITHUB_SHA'][:12]}",
              ignore_patterns=["tests/**", "**/__pycache__/**", "api_data/**", ".env", "*.pyc", "Dockerfile"],
          )
          print("uploaded:", commit)
          PY
